# ---- 日志 ----
# 引擎日志级别(tinylog:TRACE/DEBUG/INFO/WARN/ERROR;INFO 压掉内部调试刷屏)
log.level=INFO
# 应用自定义日志开关(测地模式/视角捕获/参数变化等反馈;GUI 复选框与 --verbose/--quiet 可覆盖)
log.verbose=true

# ---- 窗口 ----
# 初始窗口尺寸（渲染分辨率=窗口帧缓冲尺寸,拖拽窗口即改变）
window.width=1280
window.height=720

debugShaders=false
fov=90
maxDescs=1000
physDeviceName=Intel(R) UHD Graphics
requestedImages=3
shaderRecompilation=true
ups=30
vkValidate=true
vsync=true
zNear=0.5
zFar=50.0
# ---- 黑洞场景参数（史瓦西侧经 BlackHoleArgs 参数 UBO 传入,GUI Black Hole 面板可调） ----
# 史瓦西半径（世界单位；量纲基准，一般保持 1.0）
blackhole.schwarzschildRadius=1.0
# 吸积盘内半径（Rs 倍数，≈ISCO）
blackhole.diskInnerRadius=3.0
# 吸积盘外半径（Rs 倍数；调大会显著增加 raymarch 步数与 TAA 拖影面积）
blackhole.diskOuterRadius=18.0
# 基础温度（K，运行时可用小键盘 +/- 调节）
blackhole.temperature=90000
# 温度调节步长/上限/下限（K）
blackhole.temperatureStep=500
blackhole.temperatureMax=100000
blackhole.temperatureMin=0
# 盘动画时间速率
blackhole.timeRate=1.0
# TAA 硬重置的帧间平移阈值（Rs/帧；超过则放弃历史采样防拖影）
blackhole.taaMotionResetThreshold=0.15
# 盘前向散射（背光项：被盘消光的背景光散射回视线的比例，有方向性；0=关。
# 只泛亮剪影——视线正后方穿透盘的那束背景光的散射，亮背景下冷暗盘区泛"身后"的背景色，
# 换亮天空盒响应增强；黑洞阴影不受影响保持纯黑）
blackhole.diskScatter=0.25
# 盘环境光（弥散项：全天空 6 向辐照 × 相位折扣 0.25 × 盘密度并入发射，无方向性；0=关。
# 冷暗盘区均匀补底——暗背景下也给盘一层"存在感"，与上面的背光项拼成完整的单次散射两块；
# 黑洞阴影同样不受影响）
blackhole.diskAmbient=1.0
# 曝光增益（autoExposure 后的全局亮度乘子；GUI Black Hole 面板 Post / A-B 区可调）
blackhole.exposure=2.0
# 盘频移钳制上限（原 shader 硬编码 2.5；调小会压平趋近侧蓝移增亮）
blackhole.shiftMax=2.5
# TAA 静止累积时间常数 τ 基准秒（越大降噪越强/拖影越长；动画加速时自动按 timeRate 缩短）
blackhole.taaTau=0.3
# Bloom 亮部阈值 / 辉光混合系数 / 色调映射输出上限（bloomComposite 合成端）
blackhole.bloomThreshold=1.0
blackhole.bloomMix=0.6
blackhole.bloomMax=12.0
# 背景亮度倍率（原硬编码 0.7；散射项随背景同步缩放，0=纯黑背景突出盘本体）
blackhole.backgroundBright=0.7
# 色调映射强度（1=全 ACES 原行为，0=线性直出观察高光硬钳）
blackhole.tonemapStrength=1.0
# 盘半厚基准（Rs 倍数，原硬编码 0.5；垂直密度/厚度/尘埃层随动。
# 调大增加盘内 raymarch 采样步数略降性能）
blackhole.diskHalfThickness=0.5

# ---- 天空盒（两种时空模式共用） ----
# 山海星空盒（第二套可切换星空，取 NPGS Antiverse0Skybox 纹理 2048²；开启时惰性加载
# 约 130MB 显存；与主星空盒在各自渲染器的天空盒槽位换绑切换，着色器零改动）
skybox.mountainsSeas=false

# ---- 克尔时空参数（kerr.*，仅 Kerr 渲染模式；GUI 拖动滑条运行时覆盖） ----
# 无量纲自旋 a*（0=史瓦西极限，上限 0.998）
kerr.spin=0.9
# 采样步长质量（越低步长越大越快越糙；程序卡时先调这个）
kerr.quality=0.6
# 半分辨率 prepass + composite 边缘感知合成（大分辨率性能优化；默认关）
kerr.prepassEnabled=false
# 噪声哈希查表（PerlinNoise 的 sin 哈希 → 64³ LUT texelFetch；GUI 实时 A/B，默认关）
kerr.noiseLut=false

# ---- NPGS 原版 shader 复刻（npgs.*，npgs-verbatim 实验分支） ----
# true = 启动即进入"NPGS verbatim"时空模式（NpgsRender 用 resources/shaders/npgs/ 下
# 逐字节未动的 NPGS 原始 GLSL 渲染，含其原装 6 套天空盒与贴图盘）。GUI Controls
# 面板可随时与 Schwarzschild/Kerr 热切换；其余原版专有参数在"NPGS Orig"面板实时调。
npgs.verbatim=false
# 复刻模式直绘路径：true = BlackHole.frag.glsl 全分辨率单 pass（NPGS 原路径，无 prepass，
# 最"原汁原味"但最重）；false = prepass + composite 边缘感知合成（NPGS 管线原拓扑）
npgs.direct=false
# 复刻模式后处理链：true = NPGS 原版 compute 链（Bloom.comp GENERATE_MIPMAP 图集打包
# → GAUSS_BLUR 水平/垂直可分离模糊 → ColorBlend 辉光重建+调色，逐字节未动原版 shader）；
# false = 本框架 kerr_composite（mip 链 8-octave 辉光，两链调色部分同源，观感略有差异可 A/B）
npgs.postChain=true

# 吸积率（爱丁顿倍数）——驱动盘温标
kerr.accretionRate=0.01
# 盘外半径（Rs；内半径恒为 ISCO(a*) 自动计算）
kerr.diskOuterRadius=10.0
# 盘半厚（Rs）/ 厚度随半径增长斜率
kerr.diskHalfThickness=0.75
kerr.thicknessSlope=0.4
# 盘亮度乘数 / 盘不透明度乘数（opacity=0 盘完全不可见）
kerr.brightness=2.0
kerr.opacity=0.5
# 温度-亮度指数（越大内环越突出）
kerr.temperatureExponent=4.0
# 频移-色温指数 / 频移-亮度指数
kerr.shiftColorExponent=1.0
kerr.shiftBrightnessExponent=4.0
# 背景星空亮度乘数（0=纯黑背景，突出盘本体）
kerr.backgroundBrightness=0.6
# 盘前向散射（背光项：被盘消光的背景光散射回视线，有方向性，只泛亮剪影；0=关）
kerr.diskScatter=0.25
# 盘环境光（弥散项：全天空辐照×盘密度并入发射，无方向性，冷暗盘区均匀补底；0=关）
kerr.diskAmbient=1.0
# 无量纲电荷 Q*（Kerr–Newman 扩展；a²+Q²>1 为裸奇点）
kerr.charge=0.0
# 吸积物质比荷（参与盘温标）
kerr.mu=1.0
# 背景频移钳制上限 / 盘红化系数 / 盘饱和度指数
kerr.backShiftMax=1.5
kerr.reddening=0.0
kerr.saturation=0.0
# 光子环亮度增亮 / 光子环色温增蓝 / 盘不对称增强（显示端）
kerr.photonRingBoost=0.0
kerr.photonRingBlue=0.0
kerr.asymmetryBoost=0.0
# 热折射开关与强度
kerr.heatHazeEnabled=false
kerr.heatHaze=0.0
# 盘时间倍率（盘纹转速）
kerr.timeScale=1.0
# Bloom 辉光总强度（作用于 tonemap 后的 LDR 历史域；0=无辉光，输出为纯 NPGS ColorBlend 调色链，1.0=NPGS 原始基准）
kerr.bloomStrength=0.5
# 已废弃（mip 树 bloom 无阈值概念，见 kerr_bloom_colorblend_plan.md），键保留仅为旧配置兼容
kerr.bloomThreshold=0.7
# 喷流（需吸积率 ≥0.01 才会显现；jetBrightmut=0 时喷流关闭）
kerr.jetBrightmut=0.0
kerr.jetRedShiftExp=4.0
kerr.jetSaturation=0.0
kerr.jetShiftMax=3.0

# ---- 输入手感 ----
# 鼠标灵敏度（弧度/像素）
input.mouseSensitivity=0.003
# 自由视角翻滚速度（弧度/毫秒，Q/E）
input.rollSpeed=0.002
# WASD 移动速度系数（单位/毫秒）
input.moveSpeed=0.003
# 轨道缩放速度（Rs，PageUp/PageDown）
input.zoomSpeed=0.5
