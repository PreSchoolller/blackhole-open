name: Release

on:
  push:
    tags: [ 'v*' ]        # 推 v 开头的 tag 时触发
  workflow_dispatch:       # 也允许在网页上手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许该任务创建 Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: mvn -B -ntp package

      - uses: softprops/action-gh-release@v2
        with:
          files: target/blackhole-lwjgl-*.jar   # 只传 shaded jar，排除 original-* 中间产物
          generate_release_notes: true          # 自动按 commit 生成 changelog