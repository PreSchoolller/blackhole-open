name: Release

on:
  push:
    tags: [ 'v*' ]        # 推 v 开头的 tag 时触发
  workflow_dispatch:       # 手动触发（只构建出 artifact 供下载，不发 Release）

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-latest,  label: linux-x64 }
          - { os: macos-15,       label: macos-arm64 }   # Intel runner（macos-13）已退役；Intel Mac 用户请改用仓库 jar + 自装 JDK
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 资产文件名带上 ref 名（tag 推送=tag 名，手动触发=分支名）；tag 中的斜杠换成横杠，避免破坏文件路径
      - name: Compute asset version
        shell: bash
        run: echo "ASSET_VER=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build fat jar
        run: mvn -B -ntp package

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/jpkg-input
          cp target/blackhole-lwjgl-*.jar target/jpkg-input/

      - name: Detect required JDK modules (jdeps)
        id: modules
        shell: bash
        run: |
          MODULES=$(jdeps --print-module-deps --ignore-missing-deps target/jpkg-input/*.jar | tail -1)
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Required modules: $MODULES"

      - name: jlink trimmed runtime
        shell: bash
        run: |
          jlink --add-modules "${{ steps.modules.outputs.modules }}" \
                --strip-debug --no-man-pages --no-header-files --compress=2 \
                --output target/runtime-trim

      - name: jpackage app-image
        shell: bash
        run: |
          JAR_NAME=$(ls target/jpkg-input/*.jar | xargs -n1 basename)
          jpackage --type app-image --name BlackHole \
                   --input target/jpkg-input \
                   --main-jar "$JAR_NAME" \
                   --runtime-image target/runtime-trim \
                   --dest target/jpkg

      - name: Zip app-image (Linux)
        if: runner.os == 'Linux'
        run: (cd target/jpkg && zip -qr "../BlackHole-${ASSET_VER}-${{ matrix.label }}.zip" BlackHole)

      - name: Zip app-image (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/jpkg/BlackHole.app "target/BlackHole-${ASSET_VER}-${{ matrix.label }}.zip"

      - name: Zip app-image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/jpkg/BlackHole -DestinationPath "target/BlackHole-${env:ASSET_VER}-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHole-${{ matrix.label }}
          path: target/BlackHole-${{ env.ASSET_VER }}-${{ matrix.label }}.zip

      # fat jar 与平台无关，任选一个 job 上传一次即可（Linux 最快）
      - name: Stage universal fat jar
        if: runner.os == 'Linux'
        run: cp target/blackhole-lwjgl-*.jar "target/BlackHole-${ASSET_VER}-universal.jar"

      - name: Upload universal jar artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BlackHole-jar
          path: target/BlackHole-${{ env.ASSET_VER }}-universal.jar

  release:
    if: github.ref_type == 'tag'   # 只有 tag 推送才发 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.jar
          generate_release_notes: true
